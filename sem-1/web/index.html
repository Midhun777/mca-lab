<!DOCTYPE html>
<html>
<head>
    <title>Human Body Explorer</title>
</head>

<body style="text-align: center; background-color: lightblue;">
    <h1>Human Body Explorer</h1>

    <p>Click on an organ to learn more about it.</p>

    <!-- Human Body Image with Visible Regions -->
<div style="position: relative; width: 344px; margin: auto;">

    <img src="https://c8.alamy.com/comp/3DR4664/human-body-anatomy-with-internal-organs-infographic-diagram-3DR4664.jpg"
         alt="Human Body"
         usemap="#bodymap"
         width="344"
         style="display: block; width: 100%;">

    <!-- Visible outlines for debugging -->
    <svg viewBox="0 0 344 656"
         style="position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;">

        <!-- Heart: RED CIRCLE -->
        <circle cx="185" cy="280" r="20"
                fill="red"
                fill-opacity="0.25"
                stroke="red"
                stroke-width="3"/>

        <!-- Liver: GREEN RECTANGLE -->
        <rect x="90" y="350"
              width="100" height="60"
              fill="lime"
              fill-opacity="0.25"
              stroke="green"
              stroke-width="3"/>

        <!-- Stomach: BLUE POLYGON -->
        <polygon points="185,360 220,370 240,395
                         230,425 205,435 185,410 175,385"
                 fill="blue"
                 fill-opacity="0.25"
                 stroke="blue"
                 stroke-width="3"/>

        <!-- Kidneys: PURPLE CIRCLES -->
        <circle cx="148" cy="430" r="16"
                fill="purple"
                fill-opacity="0.25"
                stroke="purple"
                stroke-width="3"/>

        <circle cx="205" cy="430" r="16"
                fill="purple"
                fill-opacity="0.25"
                stroke="purple"
                stroke-width="3"/>

    </svg>

    <!-- Actual clickable image map -->
    <map name="bodymap">

        <area shape="circle"
              coords="185,280,20"
              href="heart.html"
              alt="Heart">

        <area shape="rect"
              coords="90,350,190,410"
              href="liver.html"
              alt="Liver">

        <area shape="poly"
              coords="185,360,220,370,240,395,230,425,205,435,185,410,175,385"
              href="stomach.html"
              alt="Stomach">

        <area shape="circle"
              coords="148,430,16"
              href="kidney.html"
              alt="Left Kidney">

        <area shape="circle"
              coords="205,430,16"
              href="kidney.html"
              alt="Right Kidney">

    </map>

</div>

</body>
</html>
