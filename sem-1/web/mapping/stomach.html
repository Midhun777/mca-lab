    <h1>Human Stomach</h1>

    <h2>About the Stomach</h2>

    <p>
        The stomach is an organ in the digestive system
        that helps break down food.
    </p>

    <h3>Functions</h3>

    <ul>
        <li>Stores food temporarily.</li>
        <li>Mixes food with digestive juices.</li>
        <li>Helps digest proteins.</li>
    </ul>
