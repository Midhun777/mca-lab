    <h1>Human Kidneys</h1>

    <h2>About the Kidneys</h2>

    <p>
        The kidneys are two bean-shaped organs located
        near the back of the abdomen.
    </p>

    <h3>Functions</h3>

    <ul>
        <li>Filter waste products from the blood.</li>
        <li>Produce urine.</li>
        <li>Help maintain the body's fluid balance.</li>
    </ul>
