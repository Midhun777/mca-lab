    <h2>About the Liver</h2>

    <p>
        The liver is an important organ located in the
        upper-right part of the abdomen.
    </p>

    <h3>Functions</h3>

    <ul>
        <li>Processes nutrients.</li>
        <li>Produces bile to help digest fats.</li>
        <li>Helps remove harmful substances from the blood.</li>
